name: backend-build-and-deploy

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/backend-deploy.yml"

env:
  BACKEND_IMAGE_NAME: taskra-backend-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setting up Node JS
        uses: actions/setup-node@v7
        with:
          node-version: "24.20"

      - name: Install dependencies & Test
        run: |
          npm ci
        working-directory: ./server

      - name: Building docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest ./server

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # make the script stop on any error
            set -e

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest

            docker run --rm \
              --network taskra \
              --env-file /home/ubuntu/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
              npm run migrate:up

            docker stop taskra-backend-app || true
            docker rm taskra-backend-app || true

            docker run -d \
              -p 3000:3000 \
              --network taskra-network \
              --name taskra-backend-app \
              --env-file /home/ubuntu/.env \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest

            docker image prune -f
